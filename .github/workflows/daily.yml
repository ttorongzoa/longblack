name: Send Longblack Daily Link

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Script
        env:
          MY_GMAIL: ${{ secrets.MY_GMAIL }}
          MY_GMAIL_APP_PASSWORD: ${{ secrets.MY_GMAIL_APP_PASSWORD }}
          RECEIVER_GMAIL: ${{ secrets.RECEIVER_GMAIL }}
        run: python longblack_notifier.py
